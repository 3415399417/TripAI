edition: 3.0.0
name: tripai-web
access: "tripai"

vars:
  region: "cn-hangzhou"

resources:
  tripai_web:
    component: fc3
    props:
      region: ${vars.region}
      functionName: tripai-web
      runtime: custom.debian10
      description: TripAI Next.js frontend (Aliyun FC)
      timeout: 300
      memorySize: 2048
      cpu: 1.0
      diskSize: 10240
      code: ./web-code
      customRuntimeConfig:
        port: 9000
        command:
          - node
          - server.js
      environmentVariables:
        NODE_ENV: production
        PORT: "9000"
        HOSTNAME: "0.0.0.0"
        PATH: /var/fc/lang/nodejs20/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        BACKEND_API_URL: ${env.BACKEND_API_URL}
      triggers:
        - triggerName: http
          triggerType: http
          description: TripAI web HTTP trigger
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - OPTIONS
