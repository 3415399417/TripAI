services:
  - type: web
    name: tripai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-ai/DeepSeek-V4-Flash
      - key: LLM_TIMEOUT_SECONDS
        value: "180"
      - key: AMAP_WEB_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
