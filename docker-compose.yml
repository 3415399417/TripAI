services:
  postgres:
    image: postgres:16-alpine
    container_name: tripai-postgres
    environment:
      POSTGRES_USER: tripai
      POSTGRES_PASSWORD: tripai
      POSTGRES_DB: tripai
    ports:
      - "5432:5432"
    volumes:
      - tripai_pgdata:/var/lib/postgresql/data

volumes:
  tripai_pgdata:

